spring.application.name=SeguridadRoles
server.port=8080

# ==========================================================
#  Base de datos MySQL
# ==========================================================
# createDatabaseIfNotExist crea la base "seguridad_roles" si no existe,
# asi no hay que crearla a mano en Workbench.
# allowPublicKeyRetrieval es necesario con MySQL 8/9 cuando no se usa SSL.
spring.datasource.url=jdbc:mysql://localhost:3306/seguridad_roles?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Usuario de MySQL creado solo para este proyecto (no se usa root).
# Se creo en Workbench con:
#   CREATE USER 'seguridad_app'@'localhost' IDENTIFIED BY 'SegRoles_2026';
#   GRANT ALL PRIVILEGES ON seguridad_roles.* TO 'seguridad_app'@'localhost';
# Solo tiene permisos sobre la base seguridad_roles.
# (Se puede cambiar sin tocar el archivo con las variables de entorno DB_USER y DB_PASSWORD.)
spring.datasource.username=${DB_USER:seguridad_app}
spring.datasource.password=${DB_PASSWORD:SegRoles_2026}

# ==========================================================
#  Scripts SQL
# ==========================================================
# Al arrancar se ejecutan schema.sql (crea las tablas del diagrama)
# y data.sql (inserta roles, usuarios y productos de prueba).
# Los dos scripts se pueden ejecutar varias veces sin duplicar datos.
spring.sql.init.mode=always

# Las tablas las crea schema.sql, no Hibernate. Asi quedan exactamente
# iguales al diagrama del ejercicio (users, roles, users_roles).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Mientras se desarrolla, que Thymeleaf no guarde las vistas en cache
spring.thymeleaf.cache=false
