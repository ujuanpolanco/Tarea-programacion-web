<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso denegado</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragments :: barra}"></header>

<main class="contenido">
    <div class="tarjeta tarjeta-error">
        <p class="codigo">403</p>
        <h1>Acceso denegado</h1>
        <p>
            Hola <strong sec:authentication="name">usuario</strong>, tu rol
            <strong sec:authentication="principal.authorities">[ROL]</strong>
            no tiene permiso para entrar a esta p&aacute;gina.
        </p>
        <a th:href="@{/}" class="boton">Volver al inicio</a>
    </div>
</main>

</body>
</html>
