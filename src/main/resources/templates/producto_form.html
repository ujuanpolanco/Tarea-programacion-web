<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${producto.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragments :: barra}"></header>

<main class="contenido">
    <div class="tarjeta">
        <h1 th:text="${producto.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>

        <!-- El mismo formulario sirve para crear (POST /new) y editar (POST /edit/{id}) -->
        <form th:action="${producto.id == null} ? @{/new} : @{/edit/{id}(id=${producto.id})}"
              th:object="${producto}" method="post">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" maxlength="100" required>

            <label for="marca">Marca</label>
            <input type="text" id="marca" th:field="*{marca}" maxlength="60" required>

            <label for="paisOrigen">Pa&iacute;s de origen</label>
            <input type="text" id="paisOrigen" th:field="*{paisOrigen}" maxlength="60" required>

            <label for="precio">Precio</label>
            <input type="number" id="precio" th:field="*{precio}" min="0" step="0.01" required>

            <div class="botones">
                <button type="submit" class="boton">Guardar</button>
                <a th:href="@{/}" class="boton boton-secundario">Cancelar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
