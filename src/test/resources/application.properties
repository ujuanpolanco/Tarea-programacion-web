# Configuracion SOLO para las pruebas (src/test).
# Usa H2 en memoria en modo MySQL, con los mismos schema.sql y data.sql
# de la aplicacion. La aplicacion real sigue usando MySQL.
spring.datasource.url=jdbc:h2:mem:seguridad_roles;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
